<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRF财务异常检测系统 (演示终端)</title>
    
    <!-- 引入 Tailwind CSS (CDN) 用于快速布局和样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Lucide 图标库 (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 自定义向上浮现的动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { 
            animation: fadeInUp 0.3s ease-out forwards; 
        }
        
        /* 隐藏日志框的滚动条，保持界面整洁，但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-6 font-sans text-slate-800">

    <!-- 头部标题区 -->
    <header class="mb-8 flex flex-col md:flex-row items-start md:items-center justify-between bg-white p-6 rounded-xl shadow-sm border border-slate-100 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-blue-900 flex items-center gap-2">
                <i data-lucide="activity" class="text-blue-600"></i>
                基于DRF的财务异常检测系统 (演示终端)
            </h1>
            <p class="text-slate-500 mt-1 text-sm">
                Research and Application of Financial Anomaly Detection Algorithm Based on Machine Learning
            </p>
        </div>
        <div class="flex gap-4">
            <div class="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 text-center">
                <div class="text-xs text-blue-500 font-semibold uppercase tracking-wider">系统准确率</div>
                <div class="text-xl font-bold text-blue-700">95.0%</div>
            </div>
            <div class="bg-purple-50 px-4 py-2 rounded-lg border border-purple-100 text-center">
                <div class="text-xs text-purple-500 font-semibold uppercase tracking-wider">AUC 值</div>
                <div class="text-xl font-bold text-purple-700">0.97</div>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左侧：输入数据源区 -->
        <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex-1">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-700">
                    <i data-lucide="database" class="w-5 h-5 text-blue-500"></i>
                    1. 实时交易数据流 (输入端)
                </h2>
                
                <!-- 交易列表容器 -->
                <div id="tx-list" class="space-y-3"></div>
                
                <!-- 按钮容器 -->
                <div id="btn-container"></div>
            </div>
        </div>

        <!-- 中间：算法可视化区 -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col">
            <h2 class="text-lg font-bold mb-6 flex items-center gap-2 text-slate-700">
                <i data-lucide="network" class="w-5 h-5 text-purple-500"></i>
                2. 深度随机森林 (DRF) 算法流水线
            </h2>
            
            <div class="flex-1 flex flex-col items-center justify-center py-8 relative">
                <!-- 算法流水线节点容器 -->
                <div id="pipeline-container" class="flex w-full items-center justify-between px-2 md:px-8"></div>

                <!-- 结果显示区容器 -->
                <div id="result-container" class="mt-12 w-full max-w-md h-24 flex items-center justify-center"></div>
            </div>

            <!-- 底部日志面板 -->
            <div id="logs-container" class="mt-4 bg-slate-900 rounded-lg p-4 h-48 overflow-y-auto no-scrollbar font-mono text-sm shadow-inner"></div>
        </div>
    </div>

    <!-- 核心交互逻辑 (Vanilla JS) -->
    <script>
        // 模拟论文中的 Table 1 银行交易数据
        const mockTransactions = [
            { id: '1001', customer: 'C001', date: '2023-12-10 14:33', amount: 700.00, type: '转账', target: 'T001', freq: '高', location: '北京', device: 'Android', ip: '192.168.1.100', isFraud: false },
            { id: '1002', customer: 'C002', date: '2023-12-10 15:49', amount: 1500.00, type: '提现', target: '-', freq: '中', location: '上海', device: 'iPhone', ip: '192.168.1.101', isFraud: false },
            { id: '1003', customer: 'C003', date: '2023-12-10 16:06', amount: 10900.00, type: '转账', target: 'T002', freq: '低', location: '广州', device: 'Windows', ip: '192.168.1.102', isFraud: false },
            { id: '1004', customer: 'C004', date: '2023-12-10 17:14', amount: 53000.00, type: '存款/异常支付', target: '-', freq: '高', location: '深圳', device: 'Linux', ip: '192.168.1.103', isFraud: true }, // 高危异常
            { id: '1005', customer: 'C005', date: '2023-12-10 18:37', amount: 300.00, type: '支付', target: 'T003', freq: '中', location: '杭州', device: 'Android', ip: '192.168.1.104', isFraud: false },
        ];

        // 全局状态管理
        const state = {
            selectedTx: mockTransactions[0],
            status: 'idle', // 可选值: idle, cnn, rf, done
            logs: []
        };

        // --- 渲染函数 ---

        function renderTransactions() {
            const container = document.getElementById('tx-list');
            const isBusy = state.status !== 'idle' && state.status !== 'done';
            
            container.innerHTML = mockTransactions.map(tx => {
                const isSelected = state.selectedTx.id === tx.id;
                const activeClass = isSelected ? 'bg-blue-50 border-blue-400 shadow-md ring-1 ring-blue-400' : 'bg-white border-slate-200 hover:bg-slate-50';
                const disabledClass = isBusy ? 'opacity-50 cursor-not-allowed pointer-events-none' : '';
                
                return `
                <div onclick="selectTx('${tx.id}')" class="p-3 rounded-lg border cursor-pointer transition-all ${activeClass} ${disabledClass}">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-slate-700">ID: ${tx.id}</span>
                        <span class="text-sm font-semibold text-slate-500">￥${tx.amount.toFixed(2)}</span>
                    </div>
                    <div class="text-xs text-slate-500 flex justify-between">
                        <span>${tx.location} | ${tx.device}</span>
                        <span>频率: ${tx.freq}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderButton() {
            const container = document.getElementById('btn-container');
            const isBusy = state.status === 'cnn' || state.status === 'rf';

            container.innerHTML = `
                <button 
                    onclick="handleAnalyze()" 
                    ${isBusy ? 'disabled' : ''} 
                    class="mt-6 w-full ${isBusy ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'} text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2"
                >
                    ${isBusy ? `<i data-lucide="activity" class="animate-spin w-5 h-5"></i> 分析中...` : '启动 DRF 算法分析'}
                </button>
            `;
            lucide.createIcons({ root: container });
        }

        function renderPipeline() {
            const container = document.getElementById('pipeline-container');
            const { status, selectedTx } = state;
            
            const isIdle = status === 'idle';
            const isCnn = status === 'cnn';
            const isRf = status === 'rf';
            const isDone = status === 'done';
            const isFraud = selectedTx.isFraud;

            // 固定决策树的高度，避免渲染时闪烁
            const treeHeights = [65, 85, 45];

            container.innerHTML = `
                <!-- 阶段 1: 原始数据 -->
                <div class="flex flex-col items-center w-1/4">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center mb-3 transition-all duration-500 ${!isIdle ? 'bg-blue-100 border-2 border-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.5)]' : 'bg-slate-100 border-2 border-slate-200'}">
                        <i data-lucide="server" class="w-8 h-8 md:w-10 md:h-10 ${!isIdle ? 'text-blue-600' : 'text-slate-400'}"></i>
                    </div>
                    <div class="text-xs md:text-sm font-bold text-slate-700">多维原始数据</div>
                    <div class="text-[10px] md:text-xs text-slate-500 mt-1 text-center hidden md:block">金额/时间/设备/IP</div>
                </div>

                <i data-lucide="arrow-right" class="w-6 h-6 md:w-8 md:h-8 transition-colors duration-500 ${isCnn || isRf || isDone ? 'text-blue-500 animate-pulse' : 'text-slate-200'}"></i>

                <!-- 阶段 2: CNN -->
                <div class="flex flex-col items-center w-1/4">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-full flex items-center justify-center mb-3 transition-all duration-500 relative ${isCnn ? 'bg-purple-100 border-4 border-purple-500 shadow-[0_0_20px_rgba(168,85,247,0.6)] scale-110' : isRf || isDone ? 'bg-purple-50 border-2 border-purple-300' : 'bg-slate-100 border-2 border-slate-200'}">
                        <i data-lucide="cpu" class="w-8 h-8 md:w-10 md:h-10 ${isCnn ? 'text-purple-600 animate-pulse' : isRf || isDone ? 'text-purple-400' : 'text-slate-400'}"></i>
                        ${isCnn ? '<div class="absolute inset-0 rounded-full border-4 border-purple-400 opacity-50 animate-ping"></div>' : ''}
                    </div>
                    <div class="text-xs md:text-sm font-bold text-slate-700">CNN 特征提取</div>
                    <div class="text-[10px] md:text-xs text-slate-500 mt-1 text-center hidden md:block">发掘高层非线性特征</div>
                </div>

                <i data-lucide="arrow-right" class="w-6 h-6 md:w-8 md:h-8 transition-colors duration-500 ${isRf || isDone ? 'text-purple-500 animate-pulse' : 'text-slate-200'}"></i>

                <!-- 阶段 3: Random Forest -->
                <div class="flex flex-col items-center w-1/4">
                    <div class="w-20 h-16 md:w-24 md:h-20 flex items-center justify-center gap-1 mb-3 transition-all duration-500 ${isRf ? 'scale-110' : ''}">
                        ${[0, 1, 2].map(index => {
                            const bgClass = isRf ? 'bg-green-100 border-green-400 shadow-[0_0_10px_rgba(74,222,128,0.5)]' : isDone ? (isFraud ? 'bg-red-100 border-red-400' : 'bg-green-100 border-green-400') : 'bg-slate-100 border-slate-200';
                            const fillClass = isRf ? 'bg-green-400 animate-pulse' : isDone ? (isFraud ? 'bg-red-400' : 'bg-green-400') : 'bg-slate-300';
                            return `
                            <div class="w-5 h-10 md:w-6 md:h-12 rounded flex flex-col items-center justify-end overflow-hidden transition-all duration-300 border ${bgClass}">
                                <div class="w-full ${fillClass}" style="height: ${treeHeights[index]}%"></div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="text-xs md:text-sm font-bold text-slate-700 text-center">集成学习(随机森林)</div>
                    <div class="text-[10px] md:text-xs text-slate-500 mt-1 text-center hidden md:block">多棵决策树独立投票</div>
                </div>
            `;
            lucide.createIcons({ root: container });
        }

        function renderResult() {
            const container = document.getElementById('result-container');
            const { status, selectedTx } = state;
            const isDone = status === 'done';
            const isFraud = selectedTx.isFraud;

            container.innerHTML = `
                <div class="w-full transition-all duration-500 transform ${isDone ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none absolute'}">
                    ${isDone ? `
                    <div class="p-4 md:p-6 rounded-2xl border-2 shadow-lg flex items-center justify-between ${isFraud ? 'bg-red-50 border-red-500' : 'bg-green-50 border-green-500'}">
                        <div>
                            <div class="text-sm font-bold text-slate-500 mb-1">系统最终裁决</div>
                            <div class="text-xl md:text-2xl font-black ${isFraud ? 'text-red-600' : 'text-green-600'}">
                                ${isFraud ? '🚨 拦截：高危欺诈交易' : '✅ 放行：正常交易行为'}
                            </div>
                        </div>
                        <div>
                            <i data-lucide="${isFraud ? 'shield-alert' : 'shield-check'}" class="w-12 h-12 md:w-16 md:h-16 ${isFraud ? 'text-red-500' : 'text-green-500'}"></i>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
            if (isDone) lucide.createIcons({ root: container });
        }

        function renderLogs() {
            const container = document.getElementById('logs-container');
            const { status, logs } = state;

            let html = `
                <div class="text-slate-400 mb-2 flex items-center gap-2 border-b border-slate-700 pb-2">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> 算法运行日志终端 (Console)
                </div>
            `;

            if (logs.length === 0) {
                html += `<div class="text-slate-600 italic">等待系统指令...</div>`;
            } else {
                html += logs.map(log => `
                    <div class="text-green-400 animate-fade-in-up mt-1">
                        <span class="text-slate-500">[${log.time}]</span> ${log.msg}
                    </div>
                `).join('');
            }

            if (status === 'cnn') {
                html += `<div class="text-purple-400 animate-pulse mt-1">_ 加载卷积核参数...高维提取中</div>`;
            }
            if (status === 'rf') {
                html += `<div class="text-blue-400 animate-pulse mt-1">_ 正在汇总100棵决策树投票权重...</div>`;
            }

            container.innerHTML = html;
            lucide.createIcons({ root: container });
            
            // 自动滚动到底部
            container.scrollTop = container.scrollHeight;
        }

        // --- 核心交互逻辑 ---

        function updateAllUI() {
            renderTransactions();
            renderButton();
            renderPipeline();
            renderResult();
            renderLogs();
        }

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            state.logs.push({ time, msg });
        }

        window.selectTx = function(id) {
            if (state.status === 'cnn' || state.status === 'rf') return; // 分析中禁止切换
            state.selectedTx = mockTransactions.find(t => t.id === id);
            state.status = 'idle';
            state.logs = [];
            updateAllUI();
        };

        window.handleAnalyze = function() {
            if (state.status === 'cnn' || state.status === 'rf') return;

            // 1. 触发 CNN 阶段
            state.status = 'cnn';
            state.logs = [];
            addLog(`[系统] 开始分析交易流水 ID: ${state.selectedTx.id}`);
            updateAllUI();

            // 2. 模拟延迟后进入 随机森林(RF) 阶段
            setTimeout(() => {
                addLog(`[CNN] 正在处理高维非线性特征...`);
                addLog(`[CNN] 已提取深层特征矩阵 (金额/频率/设备关联度)`);
                state.status = 'rf';
                updateAllUI();

                // 3. 模拟延迟后完成分析
                setTimeout(() => {
                    addLog(`[集成学习] 特征下发至随机森林...`);
                    addLog(`[随机森林] 100棵决策树正在进行独立投票`);
                    state.status = 'done';
                    addLog(`[系统] 分析完成，得出最终判定结果`);
                    updateAllUI();
                }, 2000);
            }, 2000);
        };

        // --- 初始化应用 ---
        window.onload = () => {
            updateAllUI();
            lucide.createIcons(); // 首次渲染图标
        };
    </script>
</body>
</html>
